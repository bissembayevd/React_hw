name: Deploy Assignment 5

on:
  push:
    branches: [master]
    paths:
      - "assign_5/**"
      - ".github/workflows/deploy-assign-5.yml"
  workflow_dispatch:
  workflow_run:
    workflows: [Deploy TaskSpace]
    types: [completed]
    branches: [master]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/master' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: assign_5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            assign_4/package-lock.json
            assign_5/package-lock.json
      - name: Install Assignment 5 dependencies
        run: npm ci
      - name: Lint Assignment 5
        run: npm run lint
      - name: Test Assignment 5
        run: npm test
      - name: Build Assignment 5
        run: npm run build
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Test production routes
        run: npm run test:browser
      - name: Build existing site in an isolated directory
        working-directory: .
        run: |
          mkdir -p "$RUNNER_TEMP/taskspace-assign4"
          cp -R assign_4/. "$RUNNER_TEMP/taskspace-assign4/"
          npm ci --prefix "$RUNNER_TEMP/taskspace-assign4"
          npm test --prefix "$RUNNER_TEMP/taskspace-assign4"
          npm run build --prefix "$RUNNER_TEMP/taskspace-assign4"
      - name: Assemble both sites
        working-directory: .
        run: |
          mkdir -p "$RUNNER_TEMP/taskspace-pages/assign_5"
          cp -R "$RUNNER_TEMP/taskspace-assign4/dist/." "$RUNNER_TEMP/taskspace-pages/"
          cp -R assign_5/dist/. "$RUNNER_TEMP/taskspace-pages/assign_5/"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/taskspace-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}assign_5/
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
