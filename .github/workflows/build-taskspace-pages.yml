name: Build TaskSpace Pages artifact

on:
  workflow_call:
    secrets:
      VITE_FIREBASE_API_KEY:
        required: true
      VITE_FIREBASE_AUTH_DOMAIN:
        required: true
      VITE_FIREBASE_PROJECT_ID:
        required: true
      VITE_FIREBASE_STORAGE_BUCKET:
        required: true
      VITE_FIREBASE_MESSAGING_SENDER_ID:
        required: true
      VITE_FIREBASE_APP_ID:
        required: true

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            assign_4/package-lock.json
            assign_5/package-lock.json
            assign_6/package-lock.json
            assign_7/package-lock.json
      - name: Build and test Assignment 4
        working-directory: assign_4
        run: |
          npm ci
          npm test
          npm run build
      - name: Build and test Assignment 5
        working-directory: assign_5
        run: |
          npm ci
          npm run lint
          npm test
          npm run build
          npx playwright install --with-deps chromium
          npm run test:browser
      - name: Install and test Assignments 6 and 7
        run: |
          for assignment in assign_6 assign_7; do
            (cd "$assignment" && npm ci && npm run lint && npm test) || exit 1
          done
      - name: Build Assignments 6 and 7
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
        run: |
          for assignment in assign_6 assign_7; do
            (cd "$assignment" && npm run build) || exit 1
          done
      - name: Test Assignments 6 and 7 production routes
        run: |
          (cd assign_6 && npx playwright install chromium && npm run test:browser)
          (cd assign_7 && npm run test:browser && node tests/pwa.cjs)
      - name: Assemble Pages artifact
        run: |
          mkdir -p "$RUNNER_TEMP/taskspace-pages/assign_5" "$RUNNER_TEMP/taskspace-pages/assign_6" "$RUNNER_TEMP/taskspace-pages/assign_7"
          cp -R assign_4/dist/. "$RUNNER_TEMP/taskspace-pages/"
          cp -R assign_5/dist/. "$RUNNER_TEMP/taskspace-pages/assign_5/"
          cp -R assign_6/dist/. "$RUNNER_TEMP/taskspace-pages/assign_6/"
          cp .github/retire-assign6-sw.js "$RUNNER_TEMP/taskspace-pages/assign_6/sw.js"
          cp -R assign_7/dist/. "$RUNNER_TEMP/taskspace-pages/assign_7/"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/taskspace-pages
